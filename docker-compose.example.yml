# Sample Compose file for running Linework on a single server.
# Copy it and the sample settings, edit them, then start:
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env
#   docker compose up -d --build
# docker-compose.yml and .env are git-ignored, so local changes stay out of the repo.
# See docs/self-hosting.md.

services:
  web:
    build:
      context: .
      target: web
      args:
        LINEWORK_SITE_URL: ${LINEWORK_SITE_URL:-}
    image: linework-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LINEWORK_SITE_ADDRESS: ${LINEWORK_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: .
      target: api
    image: linework-api
    restart: unless-stopped
    environment:
      # Browsers on other sites cannot join rooms. Empty allows any origin.
      LINEWORK_ALLOWED_ORIGINS: ${LINEWORK_SITE_URL:-}
    expose:
      - "8787"

volumes:
  caddy_data:
  caddy_config:
